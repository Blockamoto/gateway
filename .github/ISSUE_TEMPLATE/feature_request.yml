name: Feature request
description: Suggest an improvement or describe a use case.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behaviour
      description: The roadmap lists features that are currently available and those still awaiting validation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
