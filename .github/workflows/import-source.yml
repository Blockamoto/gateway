name: Import Gateway source
on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/repo-src.tar.xz'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand source snapshot
        shell: bash
        run: |
          set -euo pipefail
          test -f bootstrap/repo-src.tar.xz || exit 0
          mkdir -p /tmp/gateway-source
          tar -xJf bootstrap/repo-src.tar.xz -C /tmp/gateway-source
          cp -a /tmp/gateway-source/. .
          rm -rf bootstrap
      - name: Commit source to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Import Gateway Client v0.5.4 source"
          git push origin HEAD:main
