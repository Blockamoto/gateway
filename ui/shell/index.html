<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>Gateway Client</title><script id="gateway-bootstrap" type="application/json">__GATEWAY_BOOTSTRAP__</script><link rel="stylesheet" href="/shell/network.css"><link rel="icon" href="/shell/gateway.ico"><link rel="stylesheet" href="/shell/discovery.css"><link rel="stylesheet" href="/shell/style.css"><script src="/shell/discovery.js" defer></script><script src="/shell/workspace.js" defer></script><script src="/shell/app.js" defer></script><script src="/shell/network.js" defer></script></head>
<body>
<a class="skip" href="#content">Skip to content</a>
<div class="app-shell">
<aside class="sidebar"><a class="brand" href="/?resolve=.gateway" data-route=".gateway"><span class="brand-mark" aria-hidden="true"></span><span>Gateway<small>SPARSE BY DEFAULT</small></span></a><nav aria-label="Gateway destinations"><div class="nav-label">WORKSPACE</div><button data-route=".gateway" class="nav-item"><span aria-hidden="true">⌂</span>Overview</button>
<button data-route="indexes.gateway" class="nav-item"><span aria-hidden="true">▦</span>Indexes</button>
<button data-route="activity.gateway" class="nav-item"><span aria-hidden="true">≋</span>Jobs</button>
<div class="nav-label">EXPLORE BITCOIN</div><button data-route="bitcoin.gateway" class="nav-item"><span aria-hidden="true">₿</span>Bitcoin</button>
<button data-route="satline.gateway" class="nav-item"><span aria-hidden="true">↳</span>Satline</button>
<button data-route="ord.gateway" class="nav-item"><span aria-hidden="true">◇</span>Inscriptions</button>
<div class="nav-label">YOUR NODE</div><button data-route="peers.gateway" class="nav-item"><span aria-hidden="true">⋈</span>Connections</button>
<button data-route="storage.gateway" class="nav-item"><span aria-hidden="true">▥</span>Storage</button>
<button data-route="sync.gateway" class="nav-item"><span aria-hidden="true">▤</span>Data coverage</button>
<button data-route="settings.gateway" class="nav-item"><span aria-hidden="true">⚙</span>Settings</button>
<div class="nav-label">ADVANCED</div><button data-route="discovery.gateway" class="nav-item"><span aria-hidden="true">⌁</span>Probe</button>
</nav><div class="sidebar-bottom"><span class="local-label">YOUR LOCAL WORKSPACE</span><small id="version"></small><p>Keep what you need.<br>Go deeper when you choose.</p></div></aside>
<div class="main-shell"><header class="topbar"><button class="icon-button" id="back" aria-label="Go back">←</button><form id="address-form"><span aria-hidden="true" class="address-symbol">↗</span><input id="address" autocomplete="off" spellcheck="false" aria-label="Gateway resource address" placeholder="Find a block, transaction, satpoint or inscription"><button class="address-go" type="submit" aria-label="Resolve address">Go</button></form><button id="copy-address" class="icon-button" aria-label="Copy resource address">⧉</button><span id="runtime-status" class="status-pill">LOCAL</span></header>
<section class="network-strip" aria-label="Connection summary"><details id="network-details"><summary><span id="network-summary">Checking connections…</span><span class="summary-hint">Details</span></summary><div class="network-expanded"><p id="header-progress" class="network-meta"></p><div class="actions"><button data-route="peers.gateway">Manage connections</button><button id="headers-pause" data-action="pause">Pause headers</button><button id="headers-retry">Retry Bitcoin connections</button><button data-gateway-setup>Guided setup</button></div><details><summary>Technical connection state</summary><div id="network-journey"></div><pre id="network-technical"></pre></details></div></details></section>
<div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
<main id="content" tabindex="-1" aria-label="Workspace"></main><footer class="app-footer"><span>Gateway routes. Bitcoin supplies the evidence.</span><span id="footer-status">Gateway · loading version</span></footer></div>
</div><div id="toast" role="status" hidden></div><dialog id="gateway-setup" class="gateway-setup" aria-labelledby="setup-title"><header class="setup-dialog-header"><div><div id="setup-step" class="eyebrow"></div><h2 id="setup-title" tabindex="-1"></h2></div><button id="setup-close" aria-label="Close setup and continue later">Continue later</button></header><nav id="setup-index" class="setup-index" aria-label="Setup steps"></nav><section id="setup-body" class="setup-body"></section><p id="setup-error" class="setup-error" role="alert" hidden></p><footer class="setup-actions"><button id="setup-back">Back</button><button id="setup-next" class="primary">Save and continue</button></footer></dialog></body></html>
