<div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
<main id="content" tabindex="-1" aria-label="Workspace"></main><footer class="app-footer"><span>Gateway routes. Bitcoin supplies the evidence.</span><small id="version" hidden></small><span id="footer-status">Gateway · loading version</span></footer></div>
